name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      # data/termina/incidents.sqlite is an LFS object; without this the runner
      # checks out the ~133-byte pointer and the snapshot tests fail on it.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # graph_clusters.py imports networkx and agent_population_model.py imports
      # numpy + torch; install them so those tests run on CI instead of
      # depending on whatever happens to be preinstalled on the runner.
      - name: Install test dependencies
        run: python -m pip install --quiet networkx numpy torch
      - name: Compile scripts
        run: python -m compileall -q scripts
      - name: Run script tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
