name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      # Without this, one interpreter's failure cancels the other mid-run and
      # the log shows "The operation was canceled" instead of a test result.
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      # data/termina/incidents.sqlite is an LFS object; without this the runner
      # checks out the ~133-byte pointer and the snapshot tests fail on it.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # graph_clusters.py imports networkx and agent_population_model.py imports
      # numpy + torch; pin them so those tests run on CI without depending on
      # runner-preinstalled packages or whichever torch wheel pip resolves next.
      # numpy is pinned per interpreter: 2.5.x requires Python >= 3.12 and has
      # no 3.11 wheel, so a single pin fails the whole 3.11 job at install time
      # (and fail-fast cancels 3.12 before it runs a test). 2.4.6 is the newest
      # numpy with a cp311 wheel. torch 2.14.0 and networkx 3.6.1 cover both.
      - name: Install test dependencies
        run: |
          python -m pip install --quiet "networkx==3.6.1" "torch==2.14.0" \
            "numpy==2.5.3; python_version >= '3.12'" \
            "numpy==2.4.6; python_version < '3.12'"
      - name: Compile scripts
        run: python -m compileall -q scripts
      - name: Run script tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
