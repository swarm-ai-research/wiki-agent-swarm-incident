<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">Population monitor: suppression, not displacement</title>
<desc id="desc">Daily writes collapse from 6,652 on June 18 to zero after June 25 while host concentration remains high except for a brief June 22 spread.</desc>
<rect width="760" height="430" fill="#0f1419"/>
<g font-family="sans-serif" fill="#e7ecf1">
  <text x="380" y="28" text-anchor="middle" font-size="17">Population monitor: suppression, not displacement</text>
  <text x="380" y="48" text-anchor="middle" font-size="11" fill="#b0bac4">nine-wiki aggregate · daily writes and host HHI · 18–25 Jun 2026</text>
  <g stroke="#243040" stroke-width="1" opacity=".8">
    <line x1="88" y1="90" x2="710" y2="90"/><line x1="88" y1="145" x2="710" y2="145"/><line x1="88" y1="200" x2="710" y2="200"/>
    <line x1="88" y1="245" x2="710" y2="245"/><line x1="88" y1="300" x2="710" y2="300"/>
  </g>
  <g font-size="11" fill="#b0bac4" text-anchor="end">
    <text x="80" y="94">6,000</text><text x="80" y="149">4,500</text><text x="80" y="204">3,000</text><text x="80" y="249">1,500</text><text x="80" y="304">0</text>
  </g>
  <text x="22" y="195" transform="rotate(-90 22 195)" text-anchor="middle" font-size="12" fill="#b0bac4">total writes</text>
  <g fill="#5b9fd4">
    <rect x="108" y="86" width="54" height="214"/><rect x="188" y="282" width="54" height="18"/>
    <rect x="268" y="276" width="54" height="24"/><rect x="348" y="276" width="54" height="24"/>
    <rect x="428" y="259" width="54" height="41"/><rect x="508" y="300" width="54" height="1"/>
    <rect x="588" y="300" width="54" height="1"/>
  </g>
  <g font-size="10" fill="#e7ecf1" text-anchor="middle">
    <text x="135" y="79">6,652</text><text x="215" y="275">509</text><text x="295" y="269">660</text><text x="375" y="269">667</text><text x="455" y="252">1,121</text><text x="535" y="316">8</text><text x="615" y="316">3</text>
  </g>
  <text x="88" y="72" font-size="12" fill="#e8a87c">volume</text>
  <line x1="88" y1="336" x2="710" y2="336" stroke="#3d4f5f"/>
  <g stroke="#243040" stroke-width="1" opacity=".8"><line x1="88" y1="356" x2="710" y2="356"/><line x1="88" y1="384" x2="710" y2="384"/><line x1="88" y1="412" x2="710" y2="412"/></g>
  <g font-size="10" fill="#b0bac4" text-anchor="end"><text x="80" y="360">1.0</text><text x="80" y="388">0.5</text><text x="80" y="416">0.0</text></g>
  <text x="22" y="384" transform="rotate(-90 22 384)" text-anchor="middle" font-size="12" fill="#b0bac4">host HHI</text>
  <path d="M135 368 L215 370 L295 365 L375 368 L455 381 L535 368 L615 381" fill="none" stroke="#e8a87c" stroke-width="3"/>
  <g fill="#e8a87c" stroke="#0f1419" stroke-width="2"><circle cx="135" cy="368" r="5"/><circle cx="215" cy="370" r="5"/><circle cx="295" cy="365" r="5"/><circle cx="375" cy="368" r="5"/><circle cx="455" cy="381" r="5"/><circle cx="535" cy="368" r="5"/><circle cx="615" cy="381" r="5"/></g>
  <g font-size="10" fill="#e7ecf1" text-anchor="middle"><text x="135" y="350">.79</text><text x="215" y="352">.89</text><text x="295" y="347">.91</text><text x="375" y="350">.90</text><text x="455" y="401">.56</text><text x="535" y="350">.78</text><text x="615" y="401">.56</text></g>
  <g font-size="11" fill="#b0bac4" text-anchor="middle"><text x="135" y="426">Jun 18</text><text x="215" y="426">Jun 19</text><text x="295" y="426">Jun 20</text><text x="375" y="426">Jun 21</text><text x="455" y="426">Jun 22</text><text x="535" y="426">Jun 23</text><text x="615" y="426">Jun 24</text></g>
  <text x="676" y="365" font-size="11" fill="#e8a87c">HHI</text>
  <text x="455" y="235" font-size="11" fill="#7dcea0">brief spread</text>
